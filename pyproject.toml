[project]
name = "autoresearch"
version = "0.1.0"
description = "Stock price prediction for NVDA and SK Hynix (10-minute ahead)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "requests>=2.32.0",
    "scikit-learn>=1.6.0",
    "torch==2.9.1",
    "yfinance>=0.2.50",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
